# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# By default CodeRabbit only auto-reviews PRs whose base is the repository's
# default branch, so PRs stacked onto a long-lived feature branch (the
# `phoebe/feature-<issue>` integration branches) opened with no review at all —
# "Auto reviews are disabled on base/target branches other than the default
# branch." `base_branches` is a list of regexes matched against the PR's base,
# and it replaces rather than extends the default, so `main` has to be listed
# explicitly alongside the feature-branch pattern.
reviews:
  path_filters:
    # Third-party agent skills, synced unedited from upstream by `npx skills update`
    # and pinned in skills-lock.json. Findings about them belong upstream, and the
    # next update overwrites a local fix. Skills written in this repo stay reviewed,
    # which is why each vendored skill is listed by name (an exclusion can't be
    # re-included). Add a line when a skill is added to skills-lock.json.
    - "!skills-lock.json"
    - "!.agents/skills/ask-matt/**"
    - "!.agents/skills/code-review/**"
    - "!.agents/skills/codebase-design/**"
    - "!.agents/skills/diagnosing-bugs/**"
    - "!.agents/skills/domain-modeling/**"
    - "!.agents/skills/grill-me/**"
    - "!.agents/skills/grill-with-docs/**"
    - "!.agents/skills/grilling/**"
    - "!.agents/skills/handoff/**"
    - "!.agents/skills/implement/**"
    - "!.agents/skills/implement-spec/**"
    - "!.agents/skills/improve-codebase-architecture/**"
    - "!.agents/skills/pr/**"
    - "!.agents/skills/prototype/**"
    - "!.agents/skills/research/**"
    - "!.agents/skills/retro/**"
    - "!.agents/skills/setup-matt-pocock-skills/**"
    - "!.agents/skills/tdd/**"
    - "!.agents/skills/teach/**"
    - "!.agents/skills/to-spec/**"
    - "!.agents/skills/to-tickets/**"
    - "!.agents/skills/triage/**"
    - "!.agents/skills/unslop/**"
    - "!.agents/skills/wayfinder/**"
    - "!.agents/skills/writing-for-agents/**"
  auto_review:
    enabled: true
    base_branches:
      - main
      - "phoebe/feature-.*"
