# Dogfood-only overlay: run Phoebe via `phoebe boot` against a LOCAL engine mount.
#
# Layers on compose.yml. Instead of the supervisor running the baked engine
# tarball, this makes `phoebe boot` the container's long-lived main process.
# `boot` reads the mounted config, sees `engine: { source: "local" }`, and execs
# the engine from the host working tree mounted read-only at /opt/phoebe-engine
# — so edits to src/ run on the next launch with no image rebuild.
#
#   docker compose -f compose.yml -f compose.local.yml run --rm phoebe
#
# `docker stop` (SIGTERM) drains: the engine finishes its current work unit,
# starts none, and exits 0. The signal is forwarded the whole way down —
# tini → phoebe boot → engine — so the drain reaches the real process.
#
# The baked tarball (build-engine.sh) still supplies the bootstrapper (`phoebe`
# = bin.mjs + bootstrap/); only the ENGINE it execs comes from the mount.

services:
  phoebe:
    # Keep tini as PID 1 (reaps zombies, forwards signals) but replace the
    # supervisor with `phoebe boot` as the long-lived main process. Compose's
    # `command:` replaces CMD, so the boot arg lives in the entrypoint here.
    entrypoint: ["/usr/bin/tini", "--", "phoebe", "boot"]
    command: []
    volumes:
      # The engine source `boot` execs for `engine.source: "local"`. Read-only:
      # the engine works its target clone under /data, never its own source. The
      # repo root is mounted so package.json (`"type": "module"`) sits alongside
      # the `.ts` the engine runs under Node's type-stripping.
      - ../..:/opt/phoebe-engine:ro
