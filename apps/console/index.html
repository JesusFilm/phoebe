<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Both themes are declared so the browser paints its own chrome to match
         the OS before the stylesheet lands (#526: light and dark follow the OS). -->
    <meta name="color-scheme" content="light dark" />
    <title>Phoebe console</title>
    <!-- Written by apps/desktop/scripts/build-icon.mjs into public/, which Vite
         copies to the bundle root. -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
