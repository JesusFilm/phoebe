packages:
  - "."
  - "apps/*"

# The default linker, named out loud. Electron wants the strict tree; the one
# thing that would need `hoisted` is the Expo island a mobile arm might add
# later, so having this written down makes that a visible edit rather than a
# silent flip of a default.
nodeLinker: isolated

# Security pins for packages reached only through dev and packaging tooling.
#
# electron-builder and electron-updater both take js-yaml at ^4.1.0, and their
# latest releases still resolve 4.3.0, which carries GHSA-2883-xcg3-v3hh and
# GHSA-5p4m-2wfm-xmqj (#801). The override started as a floor at the fixed
# 4.3.2; since #811 it carries both onto the 5.x line, past the ^4.1.0 they
# declare. They only call load and dump through CommonJS named imports, and 5.x
# keeps both.
#
# undici (#802): node-gyp under electron-builder takes the 6.x line,
# @electron/get under electron the 7.x line, and neither parent has a release
# that moves it.
#
# vite (#803, GHSA-587h-7wmj-h5pm): it reaches the console only as the
# auto-installed peer of `@tailwindcss/vite`, so no release of that plugin can
# carry the fix; this lifts the vulnerable 8.x line to 8.1.6.
overrides:
  js-yaml: ^5.5.0
  "undici@6": 6.29.1
  "undici@7": 7.30.2
  "vite@>=8.0.0 <8.1.6": 8.1.6

# pnpm runs no dependency's install script unless it is named here. Electron's
# postinstall fetches the platform binary the desktop app runs on, which is the
# one build this repo allows. The agent container sets
# ELECTRON_SKIP_BINARY_DOWNLOAD=1 so that fetch stays out of its worktrees
# (.phoebe/container/compose.yml).
allowBuilds:
  electron: true
  # electron-builder pulls this in for Squirrel installers. Its install script
  # only picks a 7-Zip binary for that target, and the companion ships NSIS on
  # Windows (#525 §1), so it is named here as reviewed and not run. Left
  # unnamed, pnpm fails the install on it rather than skipping it.
  electron-winstaller: false
