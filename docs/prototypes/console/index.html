  page, effective-config page), switchable via `?variant=A|B|C` and a floating
  bottom bar. Pages are hash routes: #/fleet, #/d/<fp>, #/d/<fp>/config.
  Fixture data below is shaped by the map's decisions (#501 report sections,
  #502 effective-config leaves, #503 edit receipts, #504 secret presence,
  #505 identity, #506 connection panel, #507 fleet row, #508 status order).

  Run: open this file in a browser. No build, no server, no persistence.

// ───────────────────────────── helpers ─────────────────────────────
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function age(iso) { if (!iso) return "never"; const s = Math.max(0, Math.round((NOW - new Date(iso))/1000));
  if (s < 60) return s + " s"; if (s < 3600) return Math.round(s/60) + " min"; if (s < 86400) return (s/3600).toFixed(s<7200?1:0) + " h"; return Math.round(s/86400) + " d"; }

const flatPipes = (d) => d.fleet.flatMap(t => t.pipelines.map(p => ({ t: t.tenant, p })));
function doctorCounts(d) { if (!d.doctor) return null; const all = [...d.doctor.report.deployment, ...d.doctor.report.tenants.flatMap(t => t.checks)];
  return { fail: all.filter(c => c.state==="fail").length, warn: all.filter(c => c.state==="warn").length, unknown: all.filter(c => c.state==="unknown").length }; }
// #507 §9: fleet row facts + sort
function rowFacts(d) {

    const nav = `<div class="list"><a class="${sel==="overview"?"cur":""}" href="${href(fp(d))}?sel=overview">Overview</a>${d.fleet.map(t=>`<a class="${sel==="t:"+t.tenant.path?"cur":""}" href="${href(fp(d))}?sel=t:${esc(t.tenant.path)}">${esc(t.tenant.path)}${t.tenant.held?' <span class="chip fail">held</span>':""}${t.tenant.disabled?' <span class="chip">disabled</span>':""}</a>${t.pipelines.map(p=>`<a class="${sel==="p:"+t.tenant.path+"/"+p.name?"cur":""}" style="padding-left:24px" href="${href(fp(d))}?sel=p:${esc(t.tenant.path)}/${p.name}">${p.name} <span class="mut">${p.state}</span>${p.wedged?' <span class="chip fail">wedged?</span>':""}${p.process?.crashLooping?' <span class="chip warn">crash</span>':""}</a>`).join("")}`).join("")}<a class="${sel==="doctor"?"cur":""}" href="${href(fp(d))}?sel=doctor">Doctor</a><a class="${sel==="secrets"?"cur":""}" href="${href(fp(d))}?sel=secrets">Secrets</a><a href="${href(fp(d),"config")}">Effective config →</a></div>`;
    let main;
    if (sel === "overview") { const b = d.bootstrapper; main = !b ? `<div class="card mut">no deployment report: never connected</div>` : `<div class="grid g2"><div class="card"><h3>Bootstrapper</h3><dl class="kv"><dt>engine</dt><dd>${engineText(d)}</dd><dt>crash-loop</dt><dd>${b.crashLoop.failingSha?`<span class="fail">failing ${b.crashLoop.failingSha} × ${b.crashLoop.failureCount}, last good ${b.crashLoop.lastGoodSha}</span>`:"none"}</dd><dt>reconcile</dt><dd>${b.reconcile.state}${b.reconcile.reason?` (${b.reconcile.reason}) since ${age(b.reconcile.startedAt)}`:""}${b.reconcile.lastEditId?` <span class="mut">last edit ${b.reconcile.lastEditId}</span>`:""}</dd><dt>slots</dt><dd>${b.slots.held} / ${b.slots.cap}</dd><dt>report</dt><dd>${age(d.reportAt)} ago</dd></dl></div>
      <div class="card"><h3>Connection <span class="mut">(relay's facts)</span></h3><dl class="kv"><dt>state</dt><dd>${connText(d)}</dd><dt>last heard</dt><dd>${age(r.lastHeard)} ago</dd><dt>protocol</dt><dd>${r.protocol??"—"}</dd><dt>last close</dt><dd>${r.lastClose?`${r.lastClose.code} · ${age(r.lastClose.at)} ago`:"—"}</dd></dl></div></div>
      ${d.pendingEdits.length?`<div class="card"><h3>Edits not yet in a commit</h3>${d.pendingEdits.map(e=>`<div><code>${e.path}</code> = <code>${esc(JSON.stringify(e.value))}</code> <span class="mut">${age(e.at)} ago · ${e.by}</span></div>`).join("")}</div>`:""}`; }
    else if (sel.startsWith("t:")) { const t = d.fleet.find(t=>t.tenant.path===sel.slice(2)); const tn=t.tenant; main = `<div class="card"><h3>Tenant</h3><dl class="kv"><dt>path</dt><dd>${esc(tn.path)}</dd><dt>repo</dt><dd>${tn.slug?`<code>${tn.slug}</code>`:"—"}</dd><dt>arm</dt><dd>${tn.arm??"—"}</dd><dt>files</dt><dd>${["config","env","data"].map(k=>`<span class="chip ${tn[k]?"ok":"warn"}">${k}</span>`).join("")}</dd>${tn.held?`<dt>held</dt><dd class="fail">${esc(tn.held)}</dd>`:""}${tn.disabled?`<dt>disabled</dt><dd>yes</dd>`:""}</dl></div>${t.pipelines.map(p=>`<div class="card"><b>${p.name}</b> — ${stateLine(p)}<div class="mut">${processLine(p)}</div></div>`).join("")}`; }
    else if (sel.startsWith("p:")) { const [tp, pn] = [sel.slice(2).slice(0, sel.slice(2).lastIndexOf("/")), sel.slice(sel.lastIndexOf("/")+1)]; const t = d.fleet.find(t=>t.tenant.path===tp); const p = t.pipelines.find(p=>p.name===pn);
      main = `<div class="card"><h3>Process</h3>${processLine(p)}</div><div class="card"><h3>State</h3>${stateLine(p)}${p.wedged?`<div class="fail" style="margin-top:6px">${esc(p.wedgedWhy)}</div>`:""}${p.units?.length?`<table style="margin-top:8px"><tr><th>unit</th><th>kind</th><th>in flight</th><th>budget</th></tr>${p.units.map(u=>`<tr><td><a href="#">${u.id}</a></td><td>${u.kind}</td><td>${age(u.startedAt)}</td><td>${u.budgetMin} min</td></tr>`).join("")}</table>`:""}</div><div class="card"><h3>Raw status.json</h3><pre>${esc(JSON.stringify({ currentUnits: p.units||[], waitingForSlot: p.state==="waiting for slot", updatedAt: p.since }, null, 2))}</pre></div>`; }
    else if (sel === "doctor") { main = !d.doctor ? `<div class="card mut">never</div>` : `<div class="card"><div style="display:flex;justify-content:space-between"><span>${doctorText(d)} <span class="mut">· trigger ${d.doctor.trigger}${d.doctor.lastAttempt?` · last attempt ${d.doctor.lastAttempt.outcome} ${age(d.doctor.lastAttempt.at)} ago`:""}</span></span><button onclick="runDoctor('${fp(d)}')" ${r.state!=="connected"?"disabled":""}>Run doctor</button></div></div>
      <div class="card"><h3>Deployment</h3>${d.doctor.report.deployment.map(c=>`<div><span class="chip ${c.state}">${c.state}</span> ${c.id} <span class="mut">${esc(c.detail)}</span></div>`).join("")}</div>${d.doctor.report.tenants.map(t=>`<div class="card"><h3>${t.slug}</h3>${t.checks.map(c=>`<div><span class="chip ${c.state}">${c.state}</span> ${c.id} <span class="mut">${esc(c.detail)}</span></div>`).join("")}</div>`).join("")}`; }
    else if (sel === "secrets") { const groups = {}; d.env.forEach(e => { const g = e.scope==="deployment" ? "deployment" : (e.tenant || d.fleet[0]?.tenant.slug || "tenant"); (groups[g] ||= []).push(e); });
      main = Object.entries(groups).map(([g,es])=>`<div class="card"><h3>${g}${g==="deployment"?' <span class="mut">(edit .env on the host, then restart)</span>':""}</h3>${es.map(e=>`<div class="leaf"><code>${e.key}</code><span>${e.present?`<span class="chip ok">present</span> ${e.source}`:`<span class="chip warn">absent</span>`}${e.shadowed?` <span class="chip warn">shadows ${e.shadowed}</span>`:""}${e.setAt?` <span class="mut">set ${age(e.setAt)} ago by ${e.by}</span>`:""}</span><span>${e.scope==="tenant"?`<button onclick="secretSet('${fp(d)}','${e.key}',${e.tenant?`'${e.tenant}'`:"null"})">${e.present?"rotate":"set"}</button>${e.source==="store"?` <button onclick="toast('cleared')">clear</button>`:""}`:""}</span></div>`).join("")}</div>`).join("") + `<p class="mut">No value, no last-4, no hash. "Does it work" is doctor's <code>token</code> and <code>declared-env</code> checks.</p>`; }
    return `${topbar(`<a href="#/fleet">← fleet</a>`)}<div class="wrap"><h1>${d.identity.name} ${connText(d)}</h1><div class="split"><div>${nav}</div><div>${main}</div></div></div>`; },
  config(d) { const c = d.config; if (!c) return `${topbar()}<div class="wrap"><p class="mut">no report</p></div>`;
    const leaf = (path, l, full) => { const e = editable(full, l); return `<div class="leaf"><code>${esc(path)}</code><span><code>${esc(JSON.stringify(l.value))}</code> <span class="chip src ${l.source}">${l.source}${l.via?` · ${esc(l.via)}`:""}</span>${l.from?`<span class="chip">${l.from}</span>`:""}${l.reader!=="engine"?`<span class="chip">${l.reader}</span>`:""}${(l.shadowed||[]).map(s=>`<span class="chip" title="shadowed">↓ ${s.source} ${esc(JSON.stringify(s.value))}</span>`).join("")}</span><span>${e.ok?`<a href="javascript:void 0" onclick='openEdit(${JSON.stringify(fp(d))},${JSON.stringify(full)},${JSON.stringify(l)})'>${e.insert?"set…":"edit…"}</a>`:`<span class="mut">🔒 ${esc(e.why)}</span>`}</span></div>`; };
    // group global by first segment, pipelines → kinds nested
    const groups = {}; Object.entries(c.global).forEach(([p,l]) => { const [h, ...rest] = p.split("."); (groups[h] ||= []).push([rest.join(".") || h, l, p]); });
    const tree = Object.entries(groups).map(([h,ls])=>`<details open><summary>${h}</summary>${ls.map(([p,l,full])=>leaf(p,l,full)).join("")}</details>`).join("");
    const pipes = Object.entries(c.pipelines).map(([name,fields]) => { const own = Object.entries(fields).filter(([p])=>!p.startsWith("kinds.")); const kinds = {}; Object.entries(fields).filter(([p])=>p.startsWith("kinds.")).forEach(([p,l])=>{ const [,k,...rest]=p.split("."); (kinds[k] ||= []).push([rest.join("."), l, `pipelines.${name}.${p}`]); });
      return `<details open><summary>pipelines.${name}</summary>${own.map(([p,l])=>leaf(p,l,`pipelines.${name}.${p}`)).join("")}${Object.entries(kinds).map(([k,ls])=>`<details open><summary>kinds.${k}</summary>${ls.map(([p,l,full])=>leaf(p,l,full)).join("")}</details>`).join("")}</details>`; }).join("");
    return `${topbar(`<a href="${href(fp(d))}">← ${d.identity.name}</a>`)}<div class="wrap"><h1>Effective config <span class="mut">${d.identity.name}</span></h1>
      <div class="card"><b>Legend</b> ${["default","file","alias","overlay","toggle","derived","inherited"].map(s=>`<span class="chip src ${s}">${s}</span>`).join("")} <span class="mut">· overlay and toggle are both "set by env" today; #513 decides whether they merge.</span> <span class="mut" style="float:right">fingerprint <code>${c.fingerprint}</code></span></div>
      ${c.warnings.map(w=>`<div class="card warn">⚠ <code>${w.path}</code> — ${esc(w.message)}</div>`).join("")}
      <div class="card cfg-tree">${tree}${pipes}</div></div>`; },
};

// ───────────────────────────── variant C: sidebar inspector ─────────────────────────────
// The fleet is a persistent left rail (always visible, so "alive" is never more than a glance
// away); the main pane is one deployment with tabs. Config is a filterable table grouped by source.
const C = {
  rail(cur) { return `<nav><div style="padding:4px 14px" class="mut">FLEET <button style="float:right;font-size:11px;padding:1px 6px" onclick="runDoctor()">doctor all</button></div>${sortedFleet().map(d => { const f = rowFacts(d); const dot = d.relayView.state==="connected"?"ok":d.relayView.state==="dark"?"dark":"mut";
    return `<a class="${cur===fp(d)?"cur":""}" href="${href(fp(d))}"><span class="${dot}">●</span> ${d.identity.name}${d.relayView.replaced?' <span class="chip warn">replaced?</span>':""}<div class="sub mut">${d.relayView.state}${f.wedged?` · <span class="fail">${f.wedged} wedged</span>`:""}${f.crash?` · <span class="warn">crash-loop</span>`:""}${f.dc?.fail?` · <span class="fail">doctor ${f.dc.fail}</span>`:""}${f.held?` · ${f.held} held`:""}</div></a>`; }).join("")}<a href="#/people" style="margin-top:12px">People</a></nav>`; },
  fleet() { const d = sortedFleet()[0]; // fleet page = rail + a compact overview grid
    const cells = sortedFleet().map(d => { const f = rowFacts(d); const ps = flatPipes(d).filter(x=>x.p.provenance==="enumerated"); const tot = ps.length||1;
      const bar = ps.length ? `<div class="bar">${ps.map(x=>`<i style="width:${100/tot}%;background:${x.p.wedged?"#b91c1c":x.p.process?.crashLooping?"#9a6700":x.p.state==="working"?"#1a7f37":x.p.state==="waiting for slot"?"#60a5fa":"#cfcfcf"}" title="${x.t.path}/${x.p.name}: ${x.p.state}"></i>`).join("")}</div>` : "";
      return `<div class="card"><a href="${href(fp(d))}"><b>${d.identity.name}</b></a> ${connText(d)}<div style="margin:8px 0">${bar}</div><div class="mut" style="font-size:12px">${ps.length} pipelines · ${engineText(d)} · doctor ${doctorText(d)}</div></div>`; }).join("");
    return `${topbar()}<div class="side">${this.rail(null)}<div class="wrap"><h1>Fleet</h1><p class="mut">Bars: one segment per pipeline — green working, blue waiting for slot, grey idle, red wedged, amber crash-looping.</p><div class="grid g2">${cells}</div></div></div>`; },
  deployment(d, tab="overview") { const r = d.relayView; const b = d.bootstrapper;
    const tabs = ["overview","pipelines","doctor","secrets","config"].map(t=>`<a class="${tab===t?"cur":""}" href="${href(fp(d), t==="overview"?"":t)}">${t}</a>`).join("");
    let body;
    if (tab === "overview") body = !b ? `<p class="mut">no deployment report: never connected. Paired ${age(r.pairedAt)} ago.</p>` : `<div class="grid g3"><div class="card"><div class="stat">${connText(d)}<small>connection · last heard ${age(r.lastHeard)} ago · protocol ${r.protocol}${r.lastClose?` · last close ${r.lastClose.code}`:""}</small></div></div><div class="card"><div class="stat" style="font-size:15px">${engineText(d)}<small>engine · reconcile ${b.reconcile.state}${b.reconcile.reason?` (${b.reconcile.reason})`:""} · slots ${b.slots.held}/${b.slots.cap}</small></div></div><div class="card"><div class="stat" style="font-size:15px">${doctorText(d)}<small>doctor · ${d.doctor?.trigger??""}</small></div></div></div>
      <h3>Pipelines at a glance</h3>${flatPipes(d).filter(x=>x.p.provenance==="enumerated").map(x=>`<div class="pipe ${x.p.wedged?"wedged":x.p.process?.crashLooping?"crash":x.p.state==="working"?"working":""}"><b>${esc(x.t.path)}/${x.p.name}</b> — ${stateLine(x.p)}<div class="mut">${processLine(x.p)}</div>${x.p.wedged?`<div class="fail">${esc(x.p.wedgedWhy)}</div>`:""}</div>`).join("")}
      ${d.fleet.filter(t=>t.tenant.held).map(t=>`<div class="card fail">held: <b>${esc(t.tenant.path)}</b> — ${esc(t.tenant.held)}</div>`).join("")}
      ${d.pendingEdits.length?`<h3>Edits not yet in a commit</h3>${d.pendingEdits.map(e=>`<div><code>${e.path}</code> = <code>${esc(JSON.stringify(e.value))}</code> <span class="mut">${age(e.at)} ago · ${e.by}</span></div>`).join("")}`:""}`;
    else if (tab === "pipelines") body = `<table><tr><th>tenant</th><th>pipeline</th><th>process</th><th>state</th><th>units</th><th>provenance</th></tr>${d.fleet.flatMap(t => t.pipelines.length ? t.pipelines.map(p=>`<tr class="${p.wedged?"attn":""}"><td>${esc(t.tenant.path)}${t.tenant.disabled?' <span class="chip">disabled</span>':""}</td><td><b>${p.name}</b></td><td class="mut">${processLine(p)}</td><td>${stateLine(p)}${p.wedged?`<div class="fail">${esc(p.wedgedWhy)}</div>`:""}</td><td>${(p.units||[]).map(u=>`${u.id} <span class="mut">${age(u.startedAt)}/${u.budgetMin} min</span>`).join("<br>")||"—"}</td><td>${p.provenance}</td></tr>`) : [`<tr><td>${esc(t.tenant.path)}</td><td colspan=5 class="${t.tenant.held?"fail":"mut"}">${t.tenant.held?"held: "+esc(t.tenant.held):t.tenant.disabled?"disabled":"no pipelines"}</td></tr>`]).join("")}</table>`;
    else if (tab === "doctor") body = !d.doctor ? `<p class="mut">never</p>` : `<p>${doctorText(d)} <button onclick="runDoctor('${fp(d)}')" ${r.state!=="connected"?"disabled":""}>Run doctor</button>${d.doctor.lastAttempt?` <span class="mut">last attempt ${d.doctor.lastAttempt.outcome} ${age(d.doctor.lastAttempt.at)} ago</span>`:""}</p><div class="grid g2"><div class="card"><h3>deployment</h3>${d.doctor.report.deployment.map(c=>`<div><span class="${c.state}">■</span> ${c.id} <span class="mut">${esc(c.detail)}</span></div>`).join("")}</div>${d.doctor.report.tenants.map(t=>`<div class="card"><h3>${t.slug}</h3>${t.checks.map(c=>`<div><span class="${c.state}">■</span> ${c.id} <span class="mut">${esc(c.detail)}</span></div>`).join("")}</div>`).join("")}</div>`;
    else if (tab === "secrets") body = `<table><tr><th>key</th><th>scope</th><th>tenant</th><th>present</th><th>source</th><th>set</th><th></th></tr>${d.env.map(e=>`<tr><td><code>${e.key}</code></td><td>${e.scope}</td><td>${e.tenant??(e.scope==="tenant"?d.fleet[0]?.tenant.slug??"":"")}</td><td>${e.present?`<span class="ok">●</span>`:`<span class="warn">○</span>`}</td><td>${e.source??"—"}${e.shadowed?` <span class="chip warn">shadows ${e.shadowed}</span>`:""}</td><td class="mut">${e.setAt?`${age(e.setAt)} ago · ${e.by}`:""}</td><td>${e.scope==="tenant"?`<button onclick="secretSet('${fp(d)}','${e.key}',${e.tenant?`'${e.tenant}'`:"null"})">set</button>${e.source==="store"?` <button onclick="toast('cleared')">clear</button>`:""}`:`<span class="mut">host .env</span>`}</td></tr>`).join("")}</table>`;
    return `${topbar()}<div class="side">${this.rail(fp(d))}<div class="wrap"><h1>${d.identity.name} <span class="mut" style="font-size:12px">${fp(d)} · ${d.identity.arm} · report ${d.reportAt?age(d.reportAt)+" ago":"—"}</span></h1><div class="tabs">${tabs}</div>${body}</div></div>`; },
  config(d) { const c = d.config; if (!c) return this.deployment(d, "config").replace("</div></div></div>", `<p class="mut">no report</p></div></div></div>`);
    const q = (new URLSearchParams(location.hash.split("?")[1]||"").get("q")||"").toLowerCase(); const src = new URLSearchParams(location.hash.split("?")[1]||"").get("src")||"";
    const rows = []; Object.entries(c.global).forEach(([p,l])=>rows.push([p,l])); Object.entries(c.pipelines).forEach(([n,f])=>Object.entries(f).forEach(([p,l])=>rows.push([`pipelines.${n}.${p}`,l])));
    const vis = rows.filter(([p,l]) => (!q || p.toLowerCase().includes(q) || JSON.stringify(l.value).toLowerCase().includes(q)) && (!src || l.source===src));
    const counts = {}; rows.forEach(([,l])=>counts[l.source]=(counts[l.source]||0)+1);
    const table = `<table><tr><th>path</th><th>value</th><th>source</th><th>reader</th><th></th></tr>${vis.map(([p,l])=>{ const e = editable(p,l); return `<tr><td><code>${esc(p)}</code></td><td><code>${esc(JSON.stringify(l.value))}</code>${(l.shadowed||[]).map(s=>`<div class="mut" style="font-size:12px">shadows ${s.source} <code>${esc(JSON.stringify(s.value))}</code></div>`).join("")}</td><td><span class="chip src ${l.source}">${l.source}</span>${l.via?`<div class="mut" style="font-size:12px">${esc(l.via)}${l.from?` (${l.from})`:""}</div>`:""}</td><td class="mut">${l.reader}${l.opaque?" · opaque":""}</td><td>${e.ok?`<button onclick='openEdit(${JSON.stringify(fp(d))},${JSON.stringify(p)},${JSON.stringify(l)})'>${e.insert?"set":"edit"}</button>`:`<span class="mut" style="font-size:12px">${esc(e.why)}</span>`}</td></tr>`; }).join("")}</table>`;
    const body = `<p><input class="filter" placeholder="filter path or value" value="${esc(q)}" oninput="location.hash='${href(fp(d),"config")}?q='+encodeURIComponent(this.value)+'&src=${src}'"> ${Object.entries(counts).map(([s,n])=>`<a class="chip src ${s}" style="${src===s?"outline:2px solid #1f4fd8":""}" href="${href(fp(d),"config")}?q=${encodeURIComponent(q)}&src=${src===s?"":s}">${s} ${n}</a>`).join("")} <span class="mut">fingerprint <code>${c.fingerprint}</code></span></p>${c.warnings.map(w=>`<div class="card warn">⚠ <code>${w.path}</code> — ${esc(w.message)}</div>`).join("")}${table}`;
    return `${topbar()}<div class="side">${this.rail(fp(d))}<div class="wrap"><h1>${d.identity.name} <span class="mut" style="font-size:12px">effective config</span></h1><div class="tabs">${["overview","pipelines","doctor","secrets","config"].map(t=>`<a class="${t==="config"?"cur":""}" href="${href(fp(d), t==="overview"?"":t)}">${t}</a>`).join("")}</div>${body}</div></div>`; },
};
C.deployment = C.deployment.bind(C); C.config = C.config.bind(C); C.fleet = C.fleet.bind(C);

// ───────────────────────────── render ─────────────────────────────
function render() { const V = { A, B, C }[variant()] || A; const r = route(); let html;
  if (r.page === "people") html = peoplePage();
  else if (r.page === "fleet") html = V.fleet();
  else { const d = dep(r.f.split("?")[0]); if (!d) html = `${topbar()}<div class="wrap">unknown deployment</div>`;
    else if (r.page === "config") html = V.config(d);
    else html = V === C ? C.deployment(d, r.page === "deployment" ? "overview" : r.page) : V.deployment(d); }
  $("#app").innerHTML = html + modalHtml() + switcher(); }
if (!location.hash) location.hash = "#/fleet"; render();
</script>
</body>
</html>
