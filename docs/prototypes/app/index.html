<!--
  PROTOTYPE — throwaway. Not production, not served by anything.

  Question (#699, map #690): what does the companion's Remote group look like,
  and how does a remote deployment sit beside the local installs already on
  the rail, now that the relay is gone and a deployment is paired directly
  over Tailscale?

  Plan: three variants of the rail + add-remote flow, switchable via
  `?variant=A|B|C` and the floating bottom bar:
    A — two groups (This machine / Remote); a joined install lives under
        This machine with a "remote" chip; add remote is a modal with one
        smart field (link or host) plus code and label.
    B — one flat list, no groups; where a deployment is reachable from is a
        chip on the row (here / tailscale); one "+ add" with a kind picker;
        add remote is a page.
    C — two groups, but a joined install lives under Remote with a
        "this machine" chip; add remote is a probe-first page: host, then the
        descriptor the companion read, then code and label.

  Shared by every variant, because earlier tickets fixed them: the remote
  page (same five tabs as a local install, connection card showing
  reachability, Devices panel under it, #696/#697), pairing from a local
  install's install tab (host verb runs, link + code + copy + QR, #695),
  the four reachability states on the rail (#697), blocked's four reasons
  and the pair-again action, per-device revoke and sign out (#696), and the
  `400 code-rejected` wording (#694).

  The grey "simulate" box bottom-right is prototype scaffolding, not design:
  it stands in for the OS, Tailscale, and the deployment's answers.

  Run: open this file in a browser. No build, no server, no persistence.
-->

      <td>${s.self ? `<button class="sm" onclick="signOut('${fp(d)}')">sign out</button>` : `<button class="sm" ${mine?"":"disabled"} title="${mine?"":"needs operate: this device paired with read only"}" onclick="revoke('${fp(d)}','${s.id}')">revoke</button>`}</td></tr>`; }).join("")}</table>`}
    <p class="mut" style="font-size:12px">${d.local ? "Also on the host: <code>phoebe sessions</code> and <code>phoebe sessions revoke &lt;id|--all&gt;</code>." : "Revoking needs <code>operate</code>; your own row signs out instead. <code>pairedAs</code> is the Tailscale login Serve supplied at pair time, information only; the host arm has none."}</p>`; }

// connection card for a remote, or a joined local (#697)
function connCard(d) { const r = d.remote; const s = st(d);
  if (d.local) return `<div class="card"><div class="stat">${connText(d)}<small>local install · ${d.local.path} · read over compose exec, no listener${r ? ` · also at <a href="${r.url}">${esc(r.url.replace("https://",""))}</a> as <span class="chip">${r.scopes.join("</span><span class='chip'>")}</span> expires ${until(r.expiresAt)} <button class="sm" onclick="signOut('${fp(d)}')">sign out</button>` : d.local.remoteBlock && s==="running" ? ` · ${d.local.remoteBlock} arm, not paired from here: <a href="${href(fp(d),"install")}">pair on install →</a>` : ""}</small></div></div>`;
  const sess = `session <span class="chip">${r.scopes.join("</span><span class='chip'>")}</span> expires ${until(r.expiresAt)}`;
  let small;
  if (s === "blocked") small = `${esc(r.url.replace("https://",""))} · ${r.reach.reason === "replaced" ? "the descriptor's deploymentId is not the one stored at pair time" : r.reach.reason === "protocol" ? "the descriptor names a protocol this companion does not know" : r.reach.reason === "expired" ? `401 expired · the session ended ${age(r.expiresAt)} ago` : "401 unknown and the descriptor still names this deployment: revoked on the other side"} · ${d.report ? `last report greyed below` : "no report"} <button class="sm" onclick="forget('${fp(d)}')">forget</button>`;
  else small = `${esc(r.url.replace("https://",""))} · ${d.report?.remote?.arm ?? "?"} arm · protocol ${d.identity.protocol} · last heard ${age(r.lastHeardAt)} ago · ${sess} <button class="sm" onclick="signOut('${fp(d)}')">sign out</button>`;
  return `<div class="card ${s==="blocked"?"warnc":""}"><div class="stat">${connText(d, true)}<small>${small}</small></div></div>`; }

// ───────────────────────────── alerts scaffolding (#524, unchanged) ─────────────────────────────
function simRaise(kind) { SIM.extraRaised++; const n = kind === "remote" ? { tag: "jesusfilm-workspace/apps/api/work:wedged", title: "jesusfilm-workspace: wedged", body: "apps/api work — #77 has outlived its budget", href: href("dep_01J9WS7KQ4RM","pipelines") } : { tag: "scratch-repo/work:crash-looping", title: "scratch-repo (this machine): crash-looping", body: "work — 6 restarts under 60 s", href: href("dep_01J9SCR4TCH0","pipelines") };
  SIM.notif = SIM.focused ? null : n; if (SIM.focused) toast("Window focused: notification suppressed, badge still counts."); render(); }
const notifHtml = () => SIM.notif ? `<div class="notif" onclick="location.hash='${SIM.notif.href}';SIM.notif=null;render()" style="position:fixed;right:16px;top:60px;width:330px;background:rgba(245,245,245,.97);border:1px solid #ccc;border-radius:12px;padding:10px 12px;z-index:65;cursor:pointer;color:#111"><b>Phoebe</b> <span class="mut" style="float:right">now</span><div><b>${esc(SIM.notif.title)}</b></div><div class="mut">${esc(SIM.notif.body)}</div></div>` : "";
const dockHtml = () => `<div class="dock" title="dock / taskbar icon. Blocked is never counted.">P${raised() ? `<b>${raised()}</b>` : ""}</div>`;
function setReach(f, state) { const d = dep(f); if (!d?.remote) return; const r = d.remote.reach;
  if (state === "connected") d.remote.reach = { state, since: ago(0) }; else if (state === "disconnected") { d.remote.reach = { state, since: ago(0), nextTry: 8 }; d.remote.lastHeardAt = ago(20); } else if (state === "dark") { d.remote.reach = { state, since: ago(3*M) }; d.remote.lastHeardAt = ago(3*M+60); }
  else { const reason = state.split(":")[1]; d.remote.reach = { state: "blocked", reason, since: ago(0) }; if (reason === "expired") d.remote.expiresAt = ago(5*M); if (reason === "replaced") d.remote.url = d.remote.url; }
  render(); }
const simHtml = () => { const r = route(); const cur = r.f ? dep(r.f.split("?")[0]) : null; const sel = cur?.remote ? `<label>this remote's reachability <select onchange="setReach('${fp(cur)}',this.value)"><option ${cur.remote.reach.state==="connected"?"selected":""}>connected</option><option ${cur.remote.reach.state==="disconnected"?"selected":""}>disconnected</option><option ${cur.remote.reach.state==="dark"?"selected":""}>dark</option>${["expired","revoked","replaced","protocol"].map(x=>`<option value="blocked:${x}" ${cur.remote.reach.state==="blocked"&&cur.remote.reach.reason===x?"selected":""}>blocked: ${x}</option>`).join("")}</select></label>` : "";
  return `<div class="sim"><b>simulate</b> <span class="mut">(not design)</span>
  <label><input type="checkbox" ${SIM.tailscale?"checked":""} onchange="SIM.tailscale=this.checked;render()"> Tailscale on this machine</label>
  <label><input type="checkbox" ${SIM.hostTailscale?"checked":""} onchange="SIM.hostTailscale=this.checked;render()"> Tailscale on the local install's host</label>
  <label><input type="checkbox" ${theme()==="dark"?"checked":""} onchange="setTheme(this.checked?'dark':'light')"> dark theme</label>
  <label><input type="checkbox" ${SIM.tampered?"checked":""} onchange="SIM.tampered=this.checked;render()"> sessions.json tampered</label>
  <label>deployment answers to “add” <select onchange="SIM.answer=this.value">${["auto","unreachable","notphoebe","rejected","protocol"].map(x=>`<option ${SIM.answer===x?"selected":""}>${x}</option>`).join("")}</select></label>
  ${sel}
  <div style="margin-top:4px"><button onclick="ADD&&(ADD.input=(Object.values(SIM.mint)[0]?Object.values(SIM.mint)[0].url+'/pair#code='+Object.values(SIM.mint)[0].code:'https://jfm-workspace.${TAILNET}/pair#code=SPEN-T7QW-9XK4'),render())">paste a link into “add”</button><button onclick="simRaise('remote')">alert: remote</button><button onclick="simRaise('local')">alert: local</button></div></div>`; };

// ───────────────────────────── routing ─────────────────────────────
const VARIANTS = { A: "Two groups · join under This machine · modal add", B: "One list · place chips · add page", C: "Two groups · join under Remote · probe-first add" };
function variant() { return new URLSearchParams(location.search).get("variant") || "A"; }
function setVariant(v) { const u = new URL(location.href); u.searchParams.set("variant", v); history.replaceState(null, "", u); if (ADD && v === "A" && location.hash.startsWith("#/add")) location.hash = "#/fleet"; render(); }
function route() { const h = location.hash.replace(/^#\/?/, "").split("/"); if (h[0] === "d" && h[1]) return { page: h[2] === "config" ? "config" : (h[2] || "deployment"), f: decodeURIComponent(h[1]) }; if (h[0]==="new") return { page: "new" }; if (h[0]==="add") return { page: h[1]==="remote" ? "addremote" : "add" }; return { page: "fleet" }; }
const href = (f, sub) => `#/d/${encodeURIComponent(f)}${sub ? "/" + sub : ""}`;
window.addEventListener("hashchange", render);
window.addEventListener("keydown", (e) => { const t = e.target; if (t.matches("input,textarea,select,[contenteditable]")) return; const ks = Object.keys(VARIANTS); const i = ks.indexOf(variant()); if (e.key === "ArrowLeft") setVariant(ks[(i-1+ks.length)%ks.length]); if (e.key === "ArrowRight") setVariant(ks[(i+1)%ks.length]); });

// ───────────────────────────── shared bits ─────────────────────────────
function topbar() {
  const lights = `<span style="display:flex;gap:6px">${["#ff5f57","#febc2e","#28c840"].map(c=>`<i style="width:12px;height:12px;border-radius:50%;background:${c};display:inline-block"></i>`).join("")}</span>`;
  return `<div class="top">${lights}<span class="brand">Phoebe</span><span class="sp"></span><span class="mut" style="font-size:12px">${SIM.tailscale ? `Tailscale · mikes-mbp.${TAILNET}` : `<span class="warn">Tailscale off</span>`}</span></div>`; }
function switcher() { const ks = Object.keys(VARIANTS), v = variant(), i = ks.indexOf(v);
  return `<div class="switch"><button onclick="setVariant('${ks[(i-1+ks.length)%ks.length]}')">←</button><span>${v} — ${VARIANTS[v]}</span><button onclick="setVariant('${ks[(i+1)%ks.length]}')">→</button></div>`; }
function modalHtml() { if (!modal) return ""; const d = dep(modal.f);
  if (modal.secret) return `<div class="modal" onclick="if(event.target===this)closeModal()"><div class="box"><h2>Set secret <code>${modal.secret}</code>${modal.tenant?` on ${modal.tenant}`:""}</h2>
    ${d.local ? `<p class="mut">Runs <code>phoebe secret set</code> on this machine through the desktop bridge.</p>` : `<p class="mut"><code>POST /api/secrets</code> over the paired session (needs <code>operate</code>): the verb's own input, no envelope. TLS to the node is the wire's only protection; the console never reads a secret back.</p>`}
    ${modal.receipt ? receiptHtml(modal.receipt) : `<textarea class="f" id="secval" rows="3" placeholder="paste value"></textarea><p><button class="primary" onclick="submitSecret()">Set</button> <button onclick="closeModal()">Cancel</button></p>`}
    ${modal.receipt ? `<p><button onclick="closeModal()">Close</button></p>` : ""}</div></div>`;
  return `<div class="modal" onclick="if(event.target===this)closeModal()"><div class="box"><h2>Edit <code>${modal.path}</code></h2>
    <p class="mut">Field patch <code>{ path, value }</code> against fingerprint <code>${d.report?.configFingerprint}</code>; ${d.local ? "written through the desktop bridge" : "<code>POST /api/config-set</code> (operate)"}, then reconcile (reason: config). Refused if the config changed since you loaded it.</p>
    <dl class="kv"><dt>current</dt><dd><code>${esc(JSON.stringify(modal.cur.value))}</code> <span class="chip src ${modal.cur.source}">${modal.cur.source}</span> ${modal.cur.via?`<span class="mut">via ${esc(modal.cur.via)}</span>`:""}</dd></dl>
    ${modal.receipt ? receiptHtml(modal.receipt) : `<p><input class="f" id="editval" value="${esc(modal.value)}"></p><p><button class="primary" onclick="submitEdit()">Write</button> <button onclick="closeModal()">Cancel</button></p>`}
    ${modal.receipt ? `<p><button onclick="closeModal()">Close</button></p>` : ""}</div></div>`; }
function receiptHtml(r) { return r.state === "written" ? `<p><span class="chip ok">receipt: written</span> <code>${r.id}</code>${r.note?` <span class="mut">${r.note}</span>`:""}</p><p class="mut">Receipt ends here. Watch the report: reconcile → idle with <code>lastEditId=${r.id}</code>, and the leaf shows <span class="chip src file">file</span> with the new value.</p>` : `<p><span class="chip fail">receipt: refused</span> ${r.reason}</p><p>Apply by hand on the host:</p><pre>${esc(r.instruction)}</pre>`; }

// ───────────────────────────── deployment page: five tabs, plus install for locals ─────────────────────────────
function deploymentPage(d, tab="overview") { const b = d.report?.bootstrapper; const s = st(d); const f = rowFacts(d);
  const tabs = tabsFor(d).map(t=>`<a class="${tab===t?"cur":""}" href="${href(fp(d), t==="overview"?"":t)}">${t}</a>`).join("");
  const stale = f.frozen || s === "disconnected" ? `<div class="card ${s==="dark"?"":"warnc"}" style="padding:8px 14px">${s==="dark" ? `<span class="chip dark">dark</span> last heard ${age(d.remote.lastHeardAt)} ago. What follows is the last report; nothing below is current.` : s==="blocked" ? `<span class="warn">⚠ ${BLOCKED_LINE[d.remote.reach.reason]}.</span> The last report is kept, greyed; the companion retries nothing until you ${d.remote.reach.reason==="protocol"?"update":"pair again"}. ${blockedAction(d)}` : `<span class="spin"></span> reconnecting · last heard ${age(d.remote.lastHeardAt)} ago · the report below is from then.`}</div>` : "";
  let body;
  if (tab === "install") body = installPanel(d);
  else if (d.local && d.local.state !== "running") body = stoppedBody(d);
  else if (!d.report) body = `<p class="mut">no report yet</p>`;
  else if (tab === "overview") body = `<div class="grid g3">${connCard(d)}<div class="card ${f.frozen?"greyed":""}"><div class="stat" style="font-size:15px">${engineText(d)}<small>engine · reconcile ${b.reconcile.state}${b.reconcile.reason?` (${b.reconcile.reason})`:""} · slots ${b.slots.held}/${b.slots.cap}</small></div></div><div class="card ${f.frozen?"greyed":""}"><div class="stat" style="font-size:15px">${doctorText(d)}<small>doctor · ${d.report.doctor?.trigger??""}</small></div></div></div>
      ${(d.remote || d.local?.remoteBlock) ? devicesPanel(d) : ""}
      <div class="${f.frozen?"greyed":""}"><h3>Pipelines at a glance</h3>${flatPipes(d).filter(x=>x.p.provenance==="enumerated").map(x=>`<div class="pipe ${x.p.wedged?"wedged":x.p.process?.crashLooping?"crash":x.p.state==="working"?"working":""}"><b>${esc(x.t.path)}/${x.p.name}</b> — ${stateLine(x.p)}<div class="mut">${processLine(x.p)}</div>${x.p.wedged?`<div class="fail">${esc(x.p.wedgedWhy)}</div>`:""}</div>`).join("")}
      ${d.report.fleet.filter(t=>t.tenant.held).map(t=>`<div class="card failc">held: <b>${esc(t.tenant.path)}</b> — ${esc(t.tenant.held)}</div>`).join("")}
      ${d.report.pendingEdits.length?`<h3>Edits not yet in a commit</h3>${d.report.pendingEdits.map(e=>`<div><code>${e.path}</code> = <code>${esc(JSON.stringify(e.value))}</code> <span class="mut">${age(e.at)} ago · ${e.by}</span></div>`).join("")}`:""}</div>`;
  else if (tab === "pipelines") body = `<div class="${f.frozen?"greyed":""}"><table><tr><th>tenant</th><th>pipeline</th><th>process</th><th>state</th><th>units</th><th>provenance</th></tr>${d.report.fleet.flatMap(t => t.pipelines.length ? t.pipelines.map(p=>`<tr class="${p.wedged?"attn":""}"><td>${esc(t.tenant.path)}${t.tenant.disabled?' <span class="chip">disabled</span>':""}</td><td><b>${p.name}</b></td><td class="mut">${processLine(p)}</td><td>${stateLine(p)}${p.wedged?`<div class="fail">${esc(p.wedgedWhy)}</div>`:""}</td><td>${(p.units||[]).map(u=>`${u.id} <span class="mut">${age(u.startedAt)}/${u.budgetMin} min</span>`).join("<br>")||"—"}</td><td>${p.provenance}</td></tr>`) : [`<tr><td>${esc(t.tenant.path)}</td><td colspan=5 class="${t.tenant.held?"fail":"mut"}">${t.tenant.held?"held: "+esc(t.tenant.held):t.tenant.disabled?"disabled":"no pipelines"}</td></tr>`]).join("")}</table></div>`;
  else if (tab === "doctor") body = !d.report.doctor ? `<p class="mut">never</p>` : `<p>${doctorText(d)} <button onclick="runDoctor('${fp(d)}')" ${live(d)&&canOperate(d)?"":"disabled"} title="${!live(d)?st(d):!canOperate(d)?"needs operate":""}">Run doctor</button>${!canOperate(d)?' <span class="mut" style="font-size:12px">needs operate</span>':""}${d.report.doctor.lastAttempt?` <span class="mut">last attempt ${d.report.doctor.lastAttempt.outcome} ${age(d.report.doctor.lastAttempt.at)} ago</span>`:""}</p><div class="grid g2 ${f.frozen?"greyed":""}"><div class="card"><h3>deployment</h3>${d.report.doctor.report.deployment.map(c=>`<div><span class="${c.state}">■</span> ${c.id} <span class="mut">${esc(c.detail)}</span></div>`).join("")}</div>${d.report.doctor.report.tenants.map(t=>`<div class="card"><h3>${t.slug}</h3>${t.checks.map(c=>`<div><span class="${c.state}">■</span> ${c.id} <span class="mut">${esc(c.detail)}</span></div>`).join("")}</div>`).join("")}</div>`;
  else if (tab === "secrets") body = `<div class="${f.frozen?"greyed":""}"><table><tr><th>key</th><th>scope</th><th>tenant</th><th>present</th><th>source</th><th>set</th><th></th></tr>${d.report.env.map(e=>`<tr><td><code>${e.key}</code></td><td>${e.scope}</td><td>${e.tenant??(e.scope==="tenant"?d.report.fleet[0]?.tenant.slug??"":"")}</td><td>${e.present?`<span class="ok">●</span>`:`<span class="warn">○</span>`}</td><td>${e.source??"—"}${e.shadowed?` <span class="chip warn">shadows ${e.shadowed}</span>`:""}</td><td class="mut">${e.setAt?`${age(e.setAt)} ago · ${e.by}`:""}</td><td>${e.scope==="tenant"?`<button ${canOperate(d)?"":"disabled"} title="${canOperate(d)?"":"needs operate"}" onclick="secretSet('${fp(d)}','${e.key}',${e.tenant?`'${e.tenant}'`:"null"})">set</button>${e.source==="store"?` <button ${canOperate(d)?"":"disabled"} onclick="toast('cleared')">clear</button>`:""}`:`<span class="mut">host .env</span>`}</td></tr>`).join("")}</table>${!canOperate(d)?'<p class="mut" style="font-size:12px">This device paired with <code>read</code>; setting needs <code>operate</code>. Pair again with a code minted by <code>phoebe pair --operate</code>.</p>':""}</div>`;
  const title = `<h1>${d.identity.name} ${d.local&&d.remote?(variant()==="A"?'<span class="chip ts">remote</span>':variant()==="B"?'<span class="chip here">here</span><span class="chip ts">tailscale</span>':'<span class="chip here">this machine</span>'):""} <span class="mut" style="font-size:12px">${d.identity.deploymentId ?? "no id until first boot"} · ${d.identity.arm} · report ${d.reportAt?age(d.reportAt)+" ago":"—"}</span></h1>`;
  return `${topbar()}<div class="side">${shellRail(fp(d))}<div class="wrap">${title}<div class="tabs">${tabs}</div>${tab!=="install"?stale:""}${body}</div></div>`; }
function configPage(d) { const c = configFor(d); const tabs = tabsFor(d).map(t=>`<a class="${t==="config"?"cur":""}" href="${href(fp(d), t==="overview"?"":t)}">${t}</a>`).join("");
  if (!c) return `${topbar()}<div class="side">${shellRail(fp(d))}<div class="wrap"><h1>${d.identity.name}</h1><div class="tabs">${tabs}</div>${d.local&&d.local.state!=="running"?stoppedBody(d):'<p class="mut">no report</p>'}</div></div>`;
  const q = (new URLSearchParams(location.hash.split("?")[1]||"").get("q")||"").toLowerCase(); const src = new URLSearchParams(location.hash.split("?")[1]||"").get("src")||"";
  const rows = []; Object.entries(c.global).forEach(([p,l])=>rows.push([p,l])); Object.entries(c.pipelines).forEach(([n,f])=>Object.entries(f).forEach(([p,l])=>rows.push([`pipelines.${n}.${p}`,l])));
  const vis = rows.filter(([p,l]) => (!q || p.toLowerCase().includes(q) || JSON.stringify(l.value).toLowerCase().includes(q)) && (!src || l.source===src));
  const counts = {}; rows.forEach(([,l])=>counts[l.source]=(counts[l.source]||0)+1);
  const table = `<table><tr><th>path</th><th>value</th><th>source</th><th>reader</th><th></th></tr>${vis.map(([p,l])=>{ const e = editable(p,l); return `<tr><td><code>${esc(p)}</code></td><td><code>${esc(JSON.stringify(l.value))}</code>${(l.shadowed||[]).map(s=>`<div class="mut" style="font-size:12px">shadows ${s.source} <code>${esc(JSON.stringify(s.value))}</code></div>`).join("")}</td><td><span class="chip src ${l.source}">${l.source}</span>${l.via?`<div class="mut" style="font-size:12px">${esc(l.via)}${l.from?` (${l.from})`:""}</div>`:""}</td><td class="mut">${l.reader}${l.opaque?" · opaque":""}</td><td>${e.ok?`<button ${canOperate(d)?"":"disabled"} title="${canOperate(d)?"":"needs operate"}" onclick='openEdit(${JSON.stringify(fp(d))},${JSON.stringify(p)},${JSON.stringify(l)})'>${e.insert?"set":"edit"}</button>`:`<span class="mut" style="font-size:12px">${esc(e.why)}</span>`}</td></tr>`; }).join("")}</table>`;
  const body = `<p><input class="filter" placeholder="filter path or value" value="${esc(q)}" oninput="location.hash='${href(fp(d),"config")}?q='+encodeURIComponent(this.value)+'&src=${src}'"> ${Object.entries(counts).map(([s,n])=>`<a class="chip src ${s}" style="${src===s?"outline:2px solid #1f4fd8":""}" href="${href(fp(d),"config")}?q=${encodeURIComponent(q)}&src=${src===s?"":s}">${s} ${n}</a>`).join("")} <span class="mut">fingerprint <code>${c.fingerprint}</code></span></p>${c.warnings.map(w=>`<div class="card warnc">⚠ <code>${w.path}</code> — ${esc(w.message)}</div>`).join("")}<div class="${rowFacts(d).frozen?"greyed":""}">${table}</div>`;
  return `${topbar()}<div class="side">${shellRail(fp(d))}<div class="wrap"><h1>${d.identity.name} <span class="mut" style="font-size:12px">effective config</span></h1><div class="tabs">${tabs}</div>${body}</div></div>`; }

// ───────────────────────────── render ─────────────────────────────
function theme() { return new URLSearchParams(location.search).get("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
function setTheme(t) { const u = new URL(location.href); u.searchParams.set("theme", t); history.replaceState(null, "", u); render(); }
function render() { const r = route(); let html; document.body.className = "v-" + variant() + (theme()==="dark" ? " dark" : "");
  if (r.page === "fleet") html = homePage();
  else if (r.page === "new") html = newInstallPage();
  else if (r.page === "add") html = variant() === "B" ? addKindPage() : addRemotePage();
  else if (r.page === "addremote") html = variant() === "A" ? (ADD ||= { input: "", code: "", label: "Mike’s MacBook Pro", repair: null, probe: null, busy: false, error: null, done: null }, homePage()) : addRemotePage();
  else { const d = dep(r.f.split("?")[0]); if (!d) html = `${topbar()}<div class="wrap">unknown deployment <a href="#/fleet">home</a></div>`;
    else html = r.page === "config" ? configPage(d) : deploymentPage(d, r.page === "deployment" ? "overview" : r.page); }
  $("#app").innerHTML = html + modalHtml() + addModalHtml() + notifHtml() + dockHtml() + simHtml() + switcher();
  const lg = $(".log"); if (lg) lg.scrollTop = lg.scrollHeight; }
if (!location.hash) location.hash = "#/fleet"; render();
</script>
