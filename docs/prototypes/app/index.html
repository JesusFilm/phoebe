  const lights = `<span style="display:flex;gap:6px">${["#ff5f57","#febc2e","#28c840"].map(c=>`<i style="width:12px;height:12px;border-radius:50%;background:${c};display:inline-block"></i>`).join("")}</span>`;
  const seg = `<span class="seg"><a class="${SIM.source==="local"?"cur":""}" href="#/fleet" onclick="SIM.source='local'">This machine ${countChip(LOCAL)}</a><a class="${SIM.source==="relay"?"cur":""}" href="#/fleet" onclick="SIM.source='relay'">Relay ${SIM.signedIn?countChip(relayList(true)):""}</a></span>`;
  const strip = `<span title="every install and deployment, always in view">${[...LOCAL, ...sortedFleet()].map(d => { const s = d.relayView.state; const cls = rowFacts(d).attention && s!=="dark" ? "fail" : (s==="connected"||s==="running") ? "ok" : s==="dark" ? "dark" : "mut"; return `<a href="${href(fp(d))}" title="${d.identity.name}: ${s}" class="${cls}" style="padding:0 2px">●</a>`; }).join("")}</span>`;
  const mid = v==="B" ? seg : v==="C" ? `<a href="#/fleet">Home</a>${strip}` : "";
  const acct = SIM.signedIn ? `${v==="C"?'<a href="#/people">People</a>':""}<span class="mut">relay.example.org · mike@example.org</span><button onclick="signOut()">Sign out</button>` : `<span class="mut">relay.example.org · signed out</span><button class="primary" onclick="signIn()">Sign in</button>`;
  return `<div class="top">${lights}<span class="brand">Phoebe</span>${mid}<span class="sp"></span>${extra}${acct}</div>`; }
function switcher() { const ks = Object.keys(VARIANTS), v = variant(), i = ks.indexOf(v);
  return `<div class="switch"><button onclick="setVariant('${ks[(i-1+ks.length)%ks.length]}')">←</button><span>${v} — ${VARIANTS[v]}</span><button onclick="setVariant('${ks[(i+1)%ks.length]}')">→</button></div>`; }
function modalHtml() { if (!modal) return ""; const d = dep(modal.f);
  if (modal.secret) return `<div class="modal" onclick="if(event.target===this)closeModal()"><div class="box"><h2>Set secret <code>${modal.secret}</code>${modal.tenant?` on ${modal.tenant}`:""}</h2>
    ${d.local ? `<p class="mut">Runs <code>phoebe secret set</code> on this machine through the desktop bridge. No envelope, no relay.</p>` : `<p class="mut">Encrypted in the renderer to the deployment key ${fp(d)}; main forwards an envelope neither it nor the relay can open. The console never reads a secret back.</p>`}
    ${modal.receipt ? receiptHtml(modal.receipt) : `<textarea id="secval" rows="3" placeholder="paste value"></textarea><p><button class="primary" onclick="submitSecret()">Set</button> <button onclick="closeModal()">Cancel</button></p>`}
    ${modal.receipt ? `<p><button onclick="closeModal()">Close</button></p>` : ""}</div></div>`;
  return `<div class="modal" onclick="if(event.target===this)closeModal()"><div class="box"><h2>Edit <code>${modal.path}</code></h2>
    <p class="mut">Field patch <code>{ path, value }</code> against fingerprint <code>${d.configFingerprint}</code>; written in place by the bootstrapper, then reconcile (reason: config). Refused if the config changed since you loaded it.</p>
    <dl class="kv"><dt>current</dt><dd><code>${esc(JSON.stringify(modal.cur.value))}</code> <span class="chip src ${modal.cur.source}">${modal.cur.source}</span> ${modal.cur.via?`<span class="mut">via ${esc(modal.cur.via)}</span>`:""}</dd></dl>
    ${modal.receipt ? receiptHtml(modal.receipt) : `<p><input id="editval" value="${esc(modal.value)}"></p><p><button class="primary" onclick="submitEdit()">Write</button> <button onclick="closeModal()">Cancel</button></p>`}
    ${modal.receipt ? `<p><button onclick="closeModal()">Close</button></p>` : ""}</div></div>`; }
function receiptHtml(r) { return r.state === "written" ? `<p><span class="chip ok">receipt: written</span> <code>${r.id}</code>${r.note?` <span class="mut">${r.note}</span>`:""}</p><p class="mut">Receipt ends here. Watch the report: reconcile → idle with <code>lastEditId=${r.id}</code>, and the leaf shows <span class="chip src file">file</span> with the new value.</p>` : `<p><span class="chip fail">receipt: refused</span> ${r.reason}</p><p>Apply by hand on the host:</p><pre>${esc(r.instruction)}</pre>`; }
function peoplePage() { return `${topbar()}<div class="wrap"><h1>People</h1><p class="mut">Everyone here can see every deployment, edit config, set secrets, and mint pairing tokens. No roles.</p><table><tr><th>email</th><th>from</th><th>devices</th><th></th></tr>
  <tr><td>mike@example.org</td><td>first login (seed)</td><td>Mike’s MacBook Pro <span class="chip ok">this device</span> <span class="mut">now</span><br>studio-linux <span class="mut">last seen 3 d</span> <button onclick="toast('device removed; its token is revoked')">remove</button></td><td><button disabled>remove</button> <span class="mut">not yourself</span></td></tr><tr><td>sam@example.org</td><td>console</td><td>sam-mbp <span class="mut">last seen 2 h</span> <button onclick="toast('device removed')">remove</button></td><td><button onclick="toast('removed sam@example.org')">remove</button></td></tr><tr><td>ops@example.org</td><td>ALLOWED_EMAILS</td><td class="mut">browser only</td><td><button disabled>remove</button> <span class="mut">from environment</span></td></tr></table>
  <p><input class="filter" placeholder="email"> <button>Add</button></p><h2>Pair a deployment</h2><p><button class="primary" onclick="toast('pairing token <code>pt_7Hq…</code> — shown once, expires in 15 min.<br>Set <code>relay.url</code> in phoebe.config.ts and <code>PHOEBE_RELAY_TOKEN</code> in .env, then boot.')">Mint pairing token</button></p></div>`; }


// ───────────────────────────── variant C: sidebar inspector ─────────────────────────────
// The fleet is a persistent left rail (always visible, so "alive" is never more than a glance
// away); the main pane is one deployment with tabs. Config is a filterable table grouped by source.
const C = {
  rail(cur) { return shellRail(cur); },
  fleet() { return homePage(); },
  deployment(d, tab="overview") { const r = d.relayView; const b = d.bootstrapper;
    const tabs = tabsFor(d).map(t=>`<a class="${tab===t?"cur":""}" href="${href(fp(d), t==="overview"?"":t)}">${t}</a>`).join("");
    let body;
    if (tab === "install") body = installPanel(d); else if (d.local && d.local.state !== "running") body = stoppedBody(d); else if (tab === "overview") body = !b ? `<p class="mut">no deployment report: never connected. Paired ${age(r.pairedAt)} ago.</p>` : `<div class="grid g3"><div class="card"><div class="stat">${connText(d)}${d.local ? `<small>local install · ${d.local.path} · read over the desktop bridge (compose exec), no listener${d.local.paired?" · also paired to relay.example.org":""}</small>` : `<small>connection · last heard ${age(r.lastHeard)} ago · protocol ${r.protocol}${r.lastClose?` · last close ${r.lastClose.code}`:""}</small>`}</div></div><div class="card"><div class="stat" style="font-size:15px">${engineText(d)}<small>engine · reconcile ${b.reconcile.state}${b.reconcile.reason?` (${b.reconcile.reason})`:""} · slots ${b.slots.held}/${b.slots.cap}</small></div></div><div class="card"><div class="stat" style="font-size:15px">${doctorText(d)}<small>doctor · ${d.doctor?.trigger??""}</small></div></div></div>
      <h3>Pipelines at a glance</h3>${flatPipes(d).filter(x=>x.p.provenance==="enumerated").map(x=>`<div class="pipe ${x.p.wedged?"wedged":x.p.process?.crashLooping?"crash":x.p.state==="working"?"working":""}"><b>${esc(x.t.path)}/${x.p.name}</b> — ${stateLine(x.p)}<div class="mut">${processLine(x.p)}</div>${x.p.wedged?`<div class="fail">${esc(x.p.wedgedWhy)}</div>`:""}</div>`).join("")}
      ${d.fleet.filter(t=>t.tenant.held).map(t=>`<div class="card fail">held: <b>${esc(t.tenant.path)}</b> — ${esc(t.tenant.held)}</div>`).join("")}
      ${d.pendingEdits.length?`<h3>Edits not yet in a commit</h3>${d.pendingEdits.map(e=>`<div><code>${e.path}</code> = <code>${esc(JSON.stringify(e.value))}</code> <span class="mut">${age(e.at)} ago · ${e.by}</span></div>`).join("")}`:""}`;
    else if (tab === "pipelines") body = `<table><tr><th>tenant</th><th>pipeline</th><th>process</th><th>state</th><th>units</th><th>provenance</th></tr>${d.fleet.flatMap(t => t.pipelines.length ? t.pipelines.map(p=>`<tr class="${p.wedged?"attn":""}"><td>${esc(t.tenant.path)}${t.tenant.disabled?' <span class="chip">disabled</span>':""}</td><td><b>${p.name}</b></td><td class="mut">${processLine(p)}</td><td>${stateLine(p)}${p.wedged?`<div class="fail">${esc(p.wedgedWhy)}</div>`:""}</td><td>${(p.units||[]).map(u=>`${u.id} <span class="mut">${age(u.startedAt)}/${u.budgetMin} min</span>`).join("<br>")||"—"}</td><td>${p.provenance}</td></tr>`) : [`<tr><td>${esc(t.tenant.path)}</td><td colspan=5 class="${t.tenant.held?"fail":"mut"}">${t.tenant.held?"held: "+esc(t.tenant.held):t.tenant.disabled?"disabled":"no pipelines"}</td></tr>`]).join("")}</table>`;
    else if (tab === "doctor") body = !d.doctor ? `<p class="mut">never</p>` : `<p>${doctorText(d)} <button onclick="runDoctor('${fp(d)}')" ${live(d)?"":"disabled"}>Run doctor</button>${d.doctor.lastAttempt?` <span class="mut">last attempt ${d.doctor.lastAttempt.outcome} ${age(d.doctor.lastAttempt.at)} ago</span>`:""}</p><div class="grid g2"><div class="card"><h3>deployment</h3>${d.doctor.report.deployment.map(c=>`<div><span class="${c.state}">■</span> ${c.id} <span class="mut">${esc(c.detail)}</span></div>`).join("")}</div>${d.doctor.report.tenants.map(t=>`<div class="card"><h3>${t.slug}</h3>${t.checks.map(c=>`<div><span class="${c.state}">■</span> ${c.id} <span class="mut">${esc(c.detail)}</span></div>`).join("")}</div>`).join("")}</div>`;
    else if (tab === "secrets") body = `<table><tr><th>key</th><th>scope</th><th>tenant</th><th>present</th><th>source</th><th>set</th><th></th></tr>${d.env.map(e=>`<tr><td><code>${e.key}</code></td><td>${e.scope}</td><td>${e.tenant??(e.scope==="tenant"?d.fleet[0]?.tenant.slug??"":"")}</td><td>${e.present?`<span class="ok">●</span>`:`<span class="warn">○</span>`}</td><td>${e.source??"—"}${e.shadowed?` <span class="chip warn">shadows ${e.shadowed}</span>`:""}</td><td class="mut">${e.setAt?`${age(e.setAt)} ago · ${e.by}`:""}</td><td>${e.scope==="tenant"?`<button onclick="secretSet('${fp(d)}','${e.key}',${e.tenant?`'${e.tenant}'`:"null"})">set</button>${e.source==="store"?` <button onclick="toast('cleared')">clear</button>`:""}`:`<span class="mut">host .env</span>`}</td></tr>`).join("")}</table>`;
    return `${topbar()}<div class="side">${this.rail(fp(d))}<div class="wrap"><h1>${d.identity.name} <span class="mut" style="font-size:12px">${fp(d)} · ${d.identity.arm} · report ${d.reportAt?age(d.reportAt)+" ago":"—"}</span></h1><div class="tabs">${tabs}</div>${body}</div></div>`; },
  config(d) { const c = d.config; if (!c) return this.deployment(d, "config").replace("</div></div></div>", `<p class="mut">no report</p></div></div></div>`);
    const q = (new URLSearchParams(location.hash.split("?")[1]||"").get("q")||"").toLowerCase(); const src = new URLSearchParams(location.hash.split("?")[1]||"").get("src")||"";
    const rows = []; Object.entries(c.global).forEach(([p,l])=>rows.push([p,l])); Object.entries(c.pipelines).forEach(([n,f])=>Object.entries(f).forEach(([p,l])=>rows.push([`pipelines.${n}.${p}`,l])));
    const vis = rows.filter(([p,l]) => (!q || p.toLowerCase().includes(q) || JSON.stringify(l.value).toLowerCase().includes(q)) && (!src || l.source===src));
    const counts = {}; rows.forEach(([,l])=>counts[l.source]=(counts[l.source]||0)+1);
    const table = `<table><tr><th>path</th><th>value</th><th>source</th><th>reader</th><th></th></tr>${vis.map(([p,l])=>{ const e = editable(p,l); return `<tr><td><code>${esc(p)}</code></td><td><code>${esc(JSON.stringify(l.value))}</code>${(l.shadowed||[]).map(s=>`<div class="mut" style="font-size:12px">shadows ${s.source} <code>${esc(JSON.stringify(s.value))}</code></div>`).join("")}</td><td><span class="chip src ${l.source}">${l.source}</span>${l.via?`<div class="mut" style="font-size:12px">${esc(l.via)}${l.from?` (${l.from})`:""}</div>`:""}</td><td class="mut">${l.reader}${l.opaque?" · opaque":""}</td><td>${e.ok?`<button onclick='openEdit(${JSON.stringify(fp(d))},${JSON.stringify(p)},${JSON.stringify(l)})'>${e.insert?"set":"edit"}</button>`:`<span class="mut" style="font-size:12px">${esc(e.why)}</span>`}</td></tr>`; }).join("")}</table>`;
    const body = `<p><input class="filter" placeholder="filter path or value" value="${esc(q)}" oninput="location.hash='${href(fp(d),"config")}?q='+encodeURIComponent(this.value)+'&src=${src}'"> ${Object.entries(counts).map(([s,n])=>`<a class="chip src ${s}" style="${src===s?"outline:2px solid #1f4fd8":""}" href="${href(fp(d),"config")}?q=${encodeURIComponent(q)}&src=${src===s?"":s}">${s} ${n}</a>`).join("")} <span class="mut">fingerprint <code>${c.fingerprint}</code></span></p>${c.warnings.map(w=>`<div class="card warn">⚠ <code>${w.path}</code> — ${esc(w.message)}</div>`).join("")}${table}`;
    return `${topbar()}<div class="side">${this.rail(fp(d))}<div class="wrap"><h1>${d.identity.name} <span class="mut" style="font-size:12px">effective config</span></h1><div class="tabs">${tabsFor(d).map(t=>`<a class="${t==="config"?"cur":""}" href="${href(fp(d), t==="overview"?"":t)}">${t}</a>`).join("")}</div>${body}</div></div>`; },
};
C.deployment = C.deployment.bind(C); C.config = C.config.bind(C); C.fleet = C.fleet.bind(C);

// ───────────────────────────── render ─────────────────────────────
function render() { const r = route(); let html; document.body.className = "v-" + variant();
  if (r.page === "people") html = peoplePage();
  else if (r.page === "fleet") html = homePage();
  else if (r.page === "new") html = newInstallPage();
  else { const d = dep(r.f.split("?")[0]); if (!d) html = `${topbar()}<div class="wrap">unknown</div>`;
    else { if (variant()==="B") SIM.source = d.local ? "local" : "relay";
      html = r.page === "config" ? C.config(d) : C.deployment(d, r.page === "deployment" ? "overview" : r.page); } }
  $("#app").innerHTML = html + modalHtml() + notifHtml() + dockHtml() + simHtml() + switcher();
  const lg = $(".log"); if (lg) lg.scrollTop = lg.scrollHeight; }
if (!location.hash) location.hash = "#/fleet"; render();
</script>
</body>
</html>
