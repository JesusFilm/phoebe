# Nested (multi-tenant) dogfood compose — Phoebe supervising TWO repos in one
# container: JesusFilm/phoebe + JesusFilm/youtube-studio (#77).
#
# The sibling of the flat dogfood (`.phoebe/container/compose.yml`). Same image
# and same run-exactly-what-is-checked-out model (bootstrapper + engine off the
# working-tree mount); the difference is the config it points at — a nested
# deployment dir (.phoebe-nested/) whose `repos/` tree selects fleet mode, so
# `boot` runs one engine child per tenant on a shared engine instead of one child
# total. See ../README.md for the layout and what the boundary smoke proves.
#
#   ./.phoebe-nested/smoke.sh            # boundary smoke (dummy token, no secrets)
#
# Ctrl-C or `docker stop` sends SIGTERM, which drains every tenant child: each
# finishes its current work unit, starts no new one, and the container exits 0.

# Distinct project name — its own `phoebe-nested-*` volumes, so this deployment's
# /data never collides with the flat dogfood's (`phoebe-dogfood_*`) or any other
# Phoebe on the host. See the flat compose's note (#67) on why the default
# (parent-dir "container") is unsafe.
name: phoebe-nested-dogfood

services:
  phoebe:
    build:
      # Reuse the flat dogfood image verbatim — the Dockerfile carries no Phoebe
      # code (everything comes from the mount below), so nested needs no image of
      # its own. Same context + tag ⇒ a Docker-cache no-op once the flat dogfood
      # has built. (Reusing it also means the container-image drift test keeps
      # guarding the one image both deployments run.)
      context: ../../.phoebe/container
      args:
        PHOEBE_INSTALL_COMMAND: "pnpm install --frozen-lockfile"
    image: phoebe-runtime:dogfood
    entrypoint: ["/usr/bin/tini", "--", "node", "/opt/phoebe-engine/bootstrap/cli.ts", "boot"]
    command: []
    # The NESTED config dir: it holds `repos/JesusFilm/{phoebe,youtube-studio}/`,
    # and that `repos/` beside the top phoebe.config.ts is what selects fleet mode
    # (bootstrap/tenants.ts). A directory mount (not a single-file bind) so config
    # edits — including add-repo/remove-repo dropping a tenant dir — are seen by
    # boot's reconcile watch (a file bind mount pins the host inode).
    working_dir: /opt/phoebe-engine/.phoebe-nested
    environment:
      # Deployment-root token: the supervisor uses it once to install the shared
      # `gh` git-credential helper. Each TENANT still authenticates every git/`gh`
      # call with its OWN GH_TOKEN from repos/<slug>/.env — the supervisor scrubs
      # this root token out of every child's env (#61), so it is never what a
      # tenant pushes with.
      GH_TOKEN: "${GH_TOKEN:?GH_TOKEN is required (installs the shared git credential helper)}"
      PHOEBE_ENGINE_DIR: /data/engine
      # Fleet concurrency broker (#59): the cap on work units running at once
      # across ALL tenants. 1 makes the shared-engine serialization visible — the
      # two tenants take turns rather than both launching an agent together.
      PHOEBE_MAX_CONCURRENT_AGENTS: "${PHOEBE_MAX_CONCURRENT_AGENTS:-1}"
      # Tighten the reconcile/fleet poll so add/remove/relaunch of a tenant shows
      # within ten seconds instead of the default minute.
      PHOEBE_RECONCILE_INTERVAL_MS: "${PHOEBE_RECONCILE_INTERVAL_MS:-10000}"
    volumes:
      # Two named volumes (#62): all tenant data nests under /data/repos as
      # /data/repos/<owner>/<repo>/{repo,worktrees,state} — one subtree per tenant,
      # derived from the slug so two tenants can never collide.
      - phoebe-data:/data/repos
      # Engine checkouts (unused while engine.source is "local"; here so flipping
      # the shared engine to a github ref needs no compose edit).
      - phoebe-engine:/data/engine
      # The working tree: the bootstrapper, the engine boot execs for
      # `engine: { source: "local" }`, and the nested config under .phoebe-nested.
      # Read-only — every tenant works its own clone under /data, never its source.
      - ../..:/opt/phoebe-engine:ro

volumes:
  phoebe-data:
  phoebe-engine:
